name: Build events feed

on:
  schedule:
    - cron: "0 5,11,17,23 * * *"   # four times a day, UTC
  workflow_dispatch:                # manual "run now" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build feed from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          set -o pipefail
          node build.js 2>&1 | tee out.log || { echo "::error::$(tail -c 700 out.log | tr '\n' ' ')"; exit 1; }


      - name: Report feed contents
        run: |
          echo "::notice::events=$(node -e "const d=require('./dist/events.json');console.log(d.events.length+' | '+d.events.map(e=>e.title+' '+(e.start||'TBA').slice(0,10)).join(', '))")"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
